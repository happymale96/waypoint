<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>L-Tech Waypoint</title>
  <meta name="theme-color" content="#00243c">
  <meta name="description" content="Delivery-run planner for L-Tech Automation">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png" sizes="180x180">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><picture><source media="(prefers-color-scheme: dark)" srcset="symbol-header-onlight.svg"><img src="symbol-on-dark.svg" alt="" width="43" height="24"></picture><h1>L-Tech Waypoint</h1></header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="plan" class="active">Plan</button>
    <button data-tab="route">Route</button>
    <button data-tab="places">Places</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div id="toast" class="toast" hidden></div>
  <script src="storage.js"></script>
  <script src="solver.js"></script>
  <script src="messages.js"></script>
  <script src="daylog.js"></script>
  <script src="geo.js"></script>
  <script src="fuel.js"></script>
  <script src="providers.js"></script>
  <script src="app.js"></script>
</body>
</html>
